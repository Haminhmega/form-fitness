name: Check app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prepare:ai
      - run: npm run test:ai
      - run: npm run test:camera
      - run: npm run test:accounts
      - run: npm run test:rewards
      - run: npm run test:workout
      - run: npm run test:coaching
      - run: npm run test:measurements
      - run: npm run test:catalog
      - run: npm run test:anatomy
      - run: npm run test:recovery
      - run: npx playwright install --with-deps chromium
      - run: npm run test:account-recovery
      - run: npm run test:rewards-ui
      - run: |
          npm run dev -- --port 5192 &
          node scripts/wait-preview.mjs
          npm run test:ui
      - run: npm run build
